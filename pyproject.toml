[project]
name = "fx-signals"
version = "0.1.0"
description = "Explainable FX timing signals for cross-border transfers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "holidays>=0.80,<1",
  "httpx>=0.27,<1",
  "jupyter>=1.1,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6.0,<7",
  "seaborn>=0.13,<1",
  "typer>=0.12,<1",
  "scikit-learn>=1.5,<2",
  "catboost>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
fx-signals = "fx_signal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_signal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

